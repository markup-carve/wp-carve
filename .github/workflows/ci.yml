name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
          - '8.5'
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: composer test

  # The corpus, against the engine this plugin SHIPS.
  #
  # Nothing here did this. The jobs above assert hand-written expectations,
  # which a stale engine satisfies exactly as well as a current one, and
  # engine-drift.yml checks that the pins are well formed, reachable and
  # honestly labelled - all of which a pin rendering 192 documents wrongly
  # passes without complaint. A version distance cannot answer it either: 200
  # commits can change nothing and one can change a construct.
  #
  # The exposure reaches a READER rather than a test. carve-php renders post and
  # comment content on the front end, so this is what a WordPress site
  # publishes.
  #
  # It is a CEILING, not a conformance requirement. The shipped engine is a
  # published release and this repository cannot move it faster than one exists;
  # failing on the absolute number would put this job permanently red for
  # something no change here can fix, which is how a job gets ignored. What it
  # refuses is the number getting WORSE - a dependency bump that quietly
  # regresses rendering - and the step asks for the ceiling to be lowered
  # whenever the real number drops, so it ratchets instead of rotting.
  corpus:
    name: The shipped engine against carve main's corpus
    runs-on: ubuntu-latest
    env:
      # Measured at 192 of 1239 when this landed, with markup-carve/carve-php
      # 0.1.4 as the locked release. 180 of those 192 already render correctly
      # on carve-php main, so most of this number is the distance between the
      # published release and that branch rather than anything unimplemented.
      CORPUS_MAX_WRONG: 192
    steps:
      - uses: actions/checkout@v6

      - name: Check out the corpus from carve main
        uses: actions/checkout@v6
        with:
          repository: markup-carve/carve
          path: carve-main

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      # The engine AS THIS PLUGIN INSTALLS IT: the locked release, runtime
      # dependencies only, the same resolution a site gets.
      - name: Install runtime dependencies
        run: composer install --no-dev --prefer-dist --no-progress

      - name: Render every corpus document through the shipped engine
        run: |
          set -euo pipefail
          out="$(php scripts/corpus-through-engine.php carve-main/tests/corpus --list | tee /dev/stderr)"
          documents="$(printf '%s\n' "$out" | sed -n 's/^documents=//p')"
          wrong="$(printf '%s\n' "$out" | sed -n 's/^wrong=//p')"

          # The script exits non-zero when the population does not match what
          # the spec's example pages declare, so reaching this line already
          # means the whole corpus was read. Guard the extraction anyway: an
          # empty value would make every comparison below vacuously true, which
          # is the failure shape this job exists to not have.
          if [ -z "${wrong}" ] || [ -z "${documents}" ]; then
            echo "::error::the run logged no documents=/wrong= counters, so nothing was measured and nothing here is a result"
            exit 1
          fi

          echo "the shipped engine renders ${wrong} of ${documents} carve main documents differently"

          if [ "${wrong}" -gt "${CORPUS_MAX_WRONG}" ]; then
            echo "::error::${wrong} of ${documents} corpus documents render differently through the engine this plugin ships, over the ceiling of ${CORPUS_MAX_WRONG}. Something in this pull request made rendering worse."
            exit 1
          fi
          if [ "${wrong}" -lt "${CORPUS_MAX_WRONG}" ]; then
            echo "::warning::only ${wrong} of ${documents} documents render differently now, under the ceiling of ${CORPUS_MAX_WRONG}. Lower CORPUS_MAX_WRONG in .github/workflows/ci.yml to ${wrong} so the ceiling keeps meaning something."
          fi

  stan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer stan

  cs:
    name: Coding standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check coding standard
        run: composer cs-check

  js:
    name: JS round-trip tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # `npm ci` and not `npm install`: the bundle check below rebuilds and
      # diffs, so every build input has to be pinned or the diff reports
      # upstream movement as a stale bundle. The lockfile is what pins them -
      # Runtime package versions and editor ranges are locked by package-lock.json.
      - name: Install npm dependencies
        run: npm ci

      - name: Run JS tests
        run: npm run test:js

      # The engine ships as a COMMITTED bundle under assets/js/vendor. Nothing
      # else rebuilt it, so moving the pin in package.json alone changed what
      # CI resolved while the plugin kept shipping the old engine. Rebuilding
      # here and failing on a diff is what makes the pin load-bearing.
      - name: The committed engine bundles match the pin
        run: |
          npm run build
          git diff --exit-code -- assets/js/vendor \
            || { echo "::error::assets/js/vendor is stale - run 'npm run build' and commit the result."; exit 1; }

  integration:
    name: WP integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install runtime dependencies
        run: composer install --no-dev --prefer-dist --no-progress

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Start WordPress
        run: npx @wordpress/env@11.6.0 start

      - name: Activate plugin
        run: npx @wordpress/env@11.6.0 run cli wp plugin activate carve-markup

      - name: Run integration checks
        run: npx @wordpress/env@11.6.0 run cli wp eval-file wp-content/plugins/carve-markup/tests/integration/checks.php

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Stage the distribution copy (runtime deps only, .distignore applied)
        run: bash scripts/build-dist.sh

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Start WordPress for Plugin Check
        run: npx @wordpress/env@11.6.0 --config .wp-env.plugin-check.json start

      - name: Run Plugin Check
        run: |
          npx @wordpress/env@11.6.0 --config .wp-env.plugin-check.json run cli \
            wp plugin activate carve-markup
          npx @wordpress/env@11.6.0 --config .wp-env.plugin-check.json run cli \
            wp plugin check carve-markup --severity=5 --format=csv | tee plugin-check.csv
          if grep -q ',ERROR,' plugin-check.csv; then
            echo "::error::Plugin Check reported errors (see log above)."
            exit 1
          fi
