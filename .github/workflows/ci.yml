name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
          - '8.5'
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: composer test

  # The corpus, against the engine this plugin SHIPS.
  #
  # Nothing here did this. The jobs above assert hand-written expectations,
  # which a stale engine satisfies exactly as well as a current one, and
  # engine-drift.yml checks that the pins are well formed, reachable and
  # honestly labelled - all of which a pin rendering 193 documents wrongly
  # passes without complaint. A version distance cannot answer it either: 200
  # commits can change nothing and one can change a construct.
  #
  # The exposure reaches a READER rather than a test. carve-php renders post and
  # comment content on the front end, so this is what a WordPress site
  # publishes.
  #
  # BOTH SIDES ARE PINNED. The engine is a published release by maintainer
  # ruling, because this plugin ships to WordPress.org and cannot install a
  # revision; the corpus is pinned to the spec freeze for the same reason. An
  # unpinned corpus made this job measure UPSTREAM MOVEMENT: two spec pull
  # requests landing on carve main took the corpus from 1239 documents to 1241,
  # the residual went to 193, and the job failed a branch that had changed
  # nothing while telling its author they had made rendering worse. A gate that
  # can say that is a gate people learn to ignore.
  #
  # With both ends fixed the divergent set is a constant, so the recorded
  # divergences are a LIST OF NAMES rather than a count - a document regressing
  # while another is fixed leaves a count untouched. It is still a residual and
  # not a defect list: this repository cannot move the engine faster than a
  # release exists, and most of the 193 is the distance between 0.1.4 and
  # carve-php main rather than anything unimplemented.
  #
  # WHEN carve-php PUBLISHES A RELEASE, both ends move together: bump the
  # requirement, re-measure through the installed engine, and rewrite
  # scripts/corpus-divergences-at-freeze.txt from that run. The corpus ref is
  # worth revisiting in the same change - the freeze is only the right reference
  # while the shipped engine predates it.
  corpus:
    name: The shipped engine against the frozen spec corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The spec freeze: 0490ae5, 1241 documents. Pinned rather than tracking
      # carve main, because the engine on the other side of this comparison is a
      # fixed published release. With one end fixed and the other moving, the
      # number this job produces is a measurement of the spec's pace, and a
      # breach carries no information about the branch that hit it.
      - name: Check out the corpus at the spec freeze
        uses: actions/checkout@v6
        with:
          repository: markup-carve/carve
          ref: 0490ae5fba497397e95334754713ba26ecccaf07
          path: carve-freeze

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      # The engine AS THIS PLUGIN INSTALLS IT: the locked release, runtime
      # dependencies only, the same resolution a site gets.
      - name: Install runtime dependencies
        run: composer install --no-dev --prefer-dist --no-progress

      - name: Render every corpus document through the shipped engine
        run: |
          set -euo pipefail
          php scripts/corpus-through-engine.php carve-freeze/tests/corpus \
            --list --baseline=scripts/corpus-divergences-at-freeze.txt | tee "${RUNNER_TEMP}/corpus-run.txt"
          documents="$(sed -n 's/^documents=//p' "${RUNNER_TEMP}/corpus-run.txt")"
          wrong="$(sed -n 's/^wrong=//p' "${RUNNER_TEMP}/corpus-run.txt")"

          # Reaching this line already means the population guard passed and the
          # baseline held. Guard the extraction anyway: an empty value would
          # make the line below a claim about nothing, which is the failure
          # shape this job exists to not have.
          if [ -z "${documents}" ] || [ -z "${wrong}" ]; then
            echo "::error::the run logged no documents=/wrong= counters, so nothing was measured and nothing here is a result"
            exit 1
          fi

          echo "the residual against the frozen corpus is ${wrong} of ${documents} documents, the same set recorded at the freeze"

  stan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer stan

  cs:
    name: Coding standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check coding standard
        run: composer cs-check

  js:
    name: JS round-trip tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # `npm ci` and not `npm install`: the bundle check below rebuilds and
      # diffs, so every build input has to be pinned or the diff reports
      # upstream movement as a stale bundle. The lockfile is what pins them -
      # Runtime package versions and editor ranges are locked by package-lock.json.
      - name: Install npm dependencies
        run: npm ci

      - name: Run JS tests
        run: npm run test:js

      # The engine ships as a COMMITTED bundle under assets/js/vendor. Nothing
      # else rebuilt it, so moving the pin in package.json alone changed what
      # CI resolved while the plugin kept shipping the old engine. Rebuilding
      # here and failing on a diff is what makes the pin load-bearing.
      - name: The committed engine bundles match the pin
        run: |
          npm run build
          git diff --exit-code -- assets/js/vendor \
            || { echo "::error::assets/js/vendor is stale - run 'npm run build' and commit the result."; exit 1; }

  integration:
    name: WP integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install runtime dependencies
        run: composer install --no-dev --prefer-dist --no-progress

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Start WordPress
        run: npx @wordpress/env@11.6.0 start

      - name: Activate plugin
        run: npx @wordpress/env@11.6.0 run cli wp plugin activate carve-markup

      - name: Run integration checks
        run: npx @wordpress/env@11.6.0 run cli wp eval-file wp-content/plugins/carve-markup/tests/integration/checks.php

  dist-floor:
    name: The shipped tree parses on the PHP it promises
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Stage the distribution copy (runtime deps only, .distignore applied)
        run: bash scripts/build-dist.sh

      - name: Downgrade PHP 8.2 syntax for WordPress.org
        run: bash scripts/downgrade-dist.sh

      # deploy.yml runs these same two scripts, but only on `release: published`,
      # so nothing between releases ever executed them. A rector invocation that
      # fatalled on every run shipped un-downgraded to WordPress.org three times
      # before anyone looked. Running them here means a break shows up on the
      # pull request that causes it rather than at the next release.
      - name: The downgraded tree parses on the PHP versions it promises
        run: bash scripts/lint-dist-floor.sh

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Stage the distribution copy (runtime deps only, .distignore applied)
        run: bash scripts/build-dist.sh

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Start WordPress for Plugin Check
        run: npx @wordpress/env@11.6.0 --config .wp-env.plugin-check.json start

      - name: Run Plugin Check
        run: |
          npx @wordpress/env@11.6.0 --config .wp-env.plugin-check.json run cli \
            wp plugin activate carve-markup
          npx @wordpress/env@11.6.0 --config .wp-env.plugin-check.json run cli \
            wp plugin check carve-markup --severity=5 --format=csv | tee plugin-check.csv
          if grep -q ',ERROR,' plugin-check.csv; then
            echo "::error::Plugin Check reported errors (see log above)."
            exit 1
          fi
