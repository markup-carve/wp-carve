name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Every job below carries a timeout-minutes bound, so a hung step fails in
# minutes instead of running to GitHub's 360-minute default.
jobs:
  tests:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
          - '8.5'
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: composer test

  corpus:
    name: The shipped engine against the 0.2 conformance examples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # A fixed carve `main` commit, so the job tests this plugin's locked
      # engine, not an upstream change.
      - name: Check out the 0.2 conformance examples
        uses: actions/checkout@v6
        with:
          repository: markup-carve/carve
          ref: 1c8d567927ff22e99cb4950e226dbee29b127fd7 # main
          path: carve-spec

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install runtime dependencies
        run: composer install --no-dev --prefer-dist --no-progress

      - name: Render every conformance example through the shipped engine
        run: |
          set -euo pipefail
          php scripts/conformance-through-engine.php carve-spec/spec/0.2/conformance/examples.json \
            --list --baseline=scripts/conformance-divergences.txt | tee "${RUNNER_TEMP}/conformance-run.txt"
          documents="$(sed -n 's/^documents=//p' "${RUNNER_TEMP}/conformance-run.txt")"
          wrong="$(sed -n 's/^wrong=//p' "${RUNNER_TEMP}/conformance-run.txt")"
          if [ -z "${documents}" ] || [ -z "${wrong}" ]; then
            echo "::error::the run logged no documents=/wrong= counters, so nothing was measured"
            exit 1
          fi
          echo "${wrong} of ${documents} conformance examples render differently"

  stan:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer stan

  cs:
    name: Coding standard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check coding standard
        run: composer cs-check

  js:
    name: JS round-trip tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # `npm ci` and not `npm install`: the bundle check below rebuilds and
      # diffs, so every build input has to be pinned or the diff reports
      # upstream movement as a stale bundle. The lockfile is what pins them -
      # Runtime package versions and editor ranges are locked by package-lock.json.
      - name: Install npm dependencies
        run: npm ci

      # A browser is the only authority on whether a stylesheet's dark branch
      # resolves: happy-dom cannot evaluate `prefers-color-scheme` at all, so
      # the contrast test needs real computed colors.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run JS tests
        run: npm run test:js

      # The engine ships as a COMMITTED bundle under assets/js/vendor. Nothing
      # else rebuilt it, so moving the pin in package.json alone changed what
      # CI resolved while the plugin kept shipping the old engine. Rebuilding
      # here and failing on changes to the known outputs makes the pin load-bearing.
      - name: The committed engine bundles match the pin
        run: |
          npm run build
          test -z "$(git status --porcelain -- assets/js/vendor)" \
            || { echo "::error::assets/js/vendor is stale - run 'npm run build' and commit the result."; exit 1; }

  integration:
    name: WP ${{ matrix.wordpress }} / PHP ${{ matrix.php }} / Gutenberg ${{ matrix.gutenberg }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: "6.3"
            php: "8.2"
            gutenberg: "none"
          - wordpress: "latest"
            php: "8.2"
            gutenberg: "none"
          - wordpress: "latest"
            php: "8.4"
            gutenberg: "latest"
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install runtime dependencies
        run: composer install --no-dev --prefer-dist --no-progress

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Start WordPress
        run: |
          core='null'
          if [ '${{ matrix.wordpress }}' != 'latest' ]; then
            core='"WordPress/WordPress#${{ matrix.wordpress }}"'
          fi
          jq ".core=${core} | .phpVersion=\"${{ matrix.php }}\"" .wp-env.json > .wp-env.ci.json
          npx @wordpress/env@11.6.0 --config .wp-env.ci.json start

      - name: Activate plugin
        run: |
          npx @wordpress/env@11.6.0 --config .wp-env.ci.json run cli wp plugin activate carve-markup
          if [ '${{ matrix.gutenberg }}' = 'latest' ]; then
            npx @wordpress/env@11.6.0 --config .wp-env.ci.json run cli wp plugin install gutenberg --activate
            npx @wordpress/env@11.6.0 --config .wp-env.ci.json run cli wp plugin status gutenberg
          fi

      - name: Run integration checks
        run: |
          npx @wordpress/env@11.6.0 --config .wp-env.ci.json run cli wp eval-file wp-content/plugins/carve-markup/tests/integration/checks.php
          npx @wordpress/env@11.6.0 --config .wp-env.ci.json run cli wp eval-file wp-content/plugins/carve-markup/tests/integration/fallback.php
          npx @wordpress/env@11.6.0 --config .wp-env.ci.json run cli wp eval-file wp-content/plugins/carve-markup/tests/integration/detach.php

  integration-summary:
    name: WP integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: integration
    if: always()
    steps:
      - name: Require every integration matrix cell
        env:
          RESULT: ${{ needs.integration.result }}
        run: test "${RESULT}" = success

  php-floor:
    name: One PHP floor, every copy agreeing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # No PHP and no dependencies: this reads the files that state the floor.
      - name: Every copy of the PHP floor agrees with readme.txt
        run: bash scripts/check-php-floor.sh

  dist-floor:
    name: The shipped tree parses on the PHP it promises
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Stage the distribution copy (runtime deps only, .distignore applied)
        run: bash scripts/build-dist.sh

      - name: Downgrade PHP 8.2 syntax for WordPress.org
        run: bash scripts/downgrade-dist.sh

      # deploy.yml runs these same two scripts, but only on `release: published`,
      # so nothing between releases ever executed them. A rector invocation that
      # fatalled on every run shipped un-downgraded to WordPress.org three times
      # before anyone looked. Running them here means a break shows up on the
      # pull request that causes it rather than at the next release.
      - name: The downgraded tree parses on the PHP versions it promises
        run: bash scripts/lint-dist-floor.sh

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Stage the distribution copy (runtime deps only, .distignore applied)
        run: bash scripts/build-dist.sh

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Start WordPress for Plugin Check
        run: npx @wordpress/env@11.6.0 --config .wp-env.plugin-check.json start

      - name: Run Plugin Check
        run: |
          npx @wordpress/env@11.6.0 --config .wp-env.plugin-check.json run cli \
            wp plugin activate carve-markup
          npx @wordpress/env@11.6.0 --config .wp-env.plugin-check.json run cli \
            wp plugin check carve-markup --severity=5 --format=csv | tee plugin-check.csv
          if grep -q ',ERROR,' plugin-check.csv; then
            echo "::error::Plugin Check reported errors (see log above)."
            exit 1
          fi
