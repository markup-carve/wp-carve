name: Release packages and assets

on:
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      release_id:
        required: true
        type: string
      release_body:
        required: true
        type: string
      notes_digest:
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write
jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release

    steps:
      # GATE: the notes are not the workflow's to write. A CHANGELOG entry is
      # deliberately one or two lines for a contributor, which makes poor
      # release notes for a reader deciding whether to upgrade. A human writes
      # the draft first and this refuses to publish without one.
      #
      # Found by listing rather than `gh release view <tag>`: a draft's tag is
      # not a git ref, so addressing one by tag can match nothing, change
      # nothing and still exit 0.
      - name: A release draft for this tag exists and has notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$LANE_TAG\")] | first")"
          if [ -z "$release" ]; then
            echo "::error::no release for $LANE_TAG. Write the notes first:" \
                 "gh release create $LANE_TAG --draft --notes-file NOTES.md"
            exit 1
          fi
          body="$(printf '%s' "$release" | jq -r '.body // ""' | tr -d '[:space:]')"
          [ -n "$body" ] \
            || { echo "::error::the release for $LANE_TAG has no notes"; exit 1; }
          printf '%s' "$release" | jq -r '"draft=\(.draft) tag=\(.tag_name)"'

        if: ${{ inputs.publish }}
      - name: Checkout code
        uses: actions/checkout@v6

        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify approval and checked tag before publishing
        working-directory: ${{ github.workspace }}
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.source_sha }}
          RELEASE_NOTES_DIGEST: ${{ inputs.notes_digest }}
        run: python .github/scripts/release-lane.py permit
      - name: Expose the candidate tag locally
        if: ${{ !inputs.publish }}
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          git tag "$CANDIDATE_TAG" "${{ inputs.source_sha }}"
      - name: Validate version consistency
        run: |
          TAG="${{ inputs.tag }}"
          HEADER_VERSION=$(grep -oP '^\s*\*\s*Version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' carve-markup.php)
          CONSTANT_VERSION=$(grep -oP "define\('WPCARVE_VERSION',\s*'\K[0-9]+\.[0-9]+\.[0-9]+" carve-markup.php)
          STABLE_TAG=$(grep -oP '^Stable tag:\s*\K[0-9]+\.[0-9]+\.[0-9]+' readme.txt)

          echo "Release tag:      $TAG"
          echo "Header version:   $HEADER_VERSION"
          echo "Constant version: $CONSTANT_VERSION"
          echo "Stable tag:       $STABLE_TAG"

          ERRORS=0
          if [ "$HEADER_VERSION" != "$CONSTANT_VERSION" ]; then
            echo "::error::Plugin header version ($HEADER_VERSION) does not match WPCARVE_VERSION constant ($CONSTANT_VERSION)"
            ERRORS=1
          fi
          if [ "$HEADER_VERSION" != "$STABLE_TAG" ]; then
            echo "::error::Plugin header version ($HEADER_VERSION) does not match readme.txt stable tag ($STABLE_TAG)"
            ERRORS=1
          fi
          if [ "$HEADER_VERSION" != "$TAG" ]; then
            echo "::error::Plugin header version ($HEADER_VERSION) does not match release tag ($TAG)"
            ERRORS=1
          fi
          if [ "$ERRORS" -ne 0 ]; then
            echo "::error::Version mismatch detected. Run ./scripts/version.sh $TAG to fix."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check PHP syntax
        run: |
          find src -name "*.php" -exec php -l {} \;
          php -l carve-markup.php
          php -l uninstall.php

      - name: Run PHPStan
        run: composer stan

      - name: Stage distribution copy (runtime deps only, .distignore applied)
        run: bash scripts/build-dist.sh

      - name: Downgrade PHP 8.2 syntax for WordPress.org
        run: bash scripts/downgrade-dist.sh

      - name: The downgraded tree parses on the PHP versions it promises
        run: bash scripts/lint-dist-floor.sh

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: carve-markup
          BUILD_DIR: build/dist/carve-markup

        if: ${{ inputs.publish }}
      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.deploy.outputs.zip-path }}
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ inputs.source_sha }}
          draft: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ inputs.publish }}
env:
  LANE_TAG: ${{ inputs.tag }}
  LANE_REF: ${{ format('refs/tags/{0}', inputs.tag) }}
  LANE_REF_TYPE: tag
  LANE_PUBLISH: ${{ inputs.publish }}
