name: Engine drift

# `@markup-carve/carve` is a GIT dependency, and a pin is what makes a build
# reproducible - but nothing notices when the pin falls behind, and a push-only
# CI reports the state of the day someone last touched the repo.
#
# The exposure here reaches a READER, not a test. The engine ships as a
# committed bundle under `assets/js/vendor`, so the pin decides what a WordPress
# site publishes. #61 made the pin load-bearing by rebuilding the bundle in CI
# and failing on a diff, which closed the "pin and bundle disagree" half. This
# is the other half: the pin itself going stale, which #61 could not catch
# because a stale pin and a bundle built from it agree perfectly.
#
# That is not hypothetical. #61 found the pin 37 commits back; a month later it
# was 29 back again, and the shipped bundle rendered
#
#     > *[HTML]: Hyper Text
#
# as an EMPTY blockquote - the author's line dropped from the page while the
# abbreviation expanded outside the quote. A point-in-time bump does not stay
# fixed; a job that says so does.
#
# It reports rather than gates on lag: upstream moving is not a defect here, and
# a job that goes red for something outside the repository teaches people to
# ignore it. It DOES fail when the pin is not a 40-hex revision, or is not a real
# commit on carve-js main. carve-js has rewritten history before - three sibling
# repos pinned revisions a fresh clone cannot check out (carve#499) - so an
# unreachable pin is a real failure mode rather than a hypothetical.

# The JavaScript engine remains an exact git dependency and is checked against
# upstream main. The grammar is a released npm dependency now; its manifest,
# lockfile root and installed version are checked for exact agreement below.
#
# The PHP engine is a released Composer dependency now, and it gets its own
# check rather than the revision check, because a release can go wrong in a way
# a revision cannot: `dev-main#<rev> as 0.1.4` installs a revision while telling
# every reader it is the 0.1.4 release. That is what this repo shipped until the
# constraint became `^0.1.4`, and the pin was one commit short of the tag. So the
# check refuses an aliased or revision-shaped constraint, and then requires the
# locked reference to be the commit the tag actually points at.

on:
  schedule:
    # 05:00 UTC daily, alongside the spec-drift run.
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  engine-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check out the engine
        uses: actions/checkout@v6
        with:
          repository: markup-carve/carve-js
          path: carve-js
          fetch-depth: 0

      - name: Check out the grammars
        uses: actions/checkout@v6
        with:
          repository: markup-carve/carve-grammars
          path: carve-grammars
          fetch-depth: 0

      - name: Check out the PHP engine
        uses: actions/checkout@v6
        with:
          repository: markup-carve/carve-php
          path: carve-php
          fetch-depth: 0

      - name: Every git dependency pins a revision that is on its upstream main
        run: |
          set -euo pipefail

          # Reads either section: the engine is a runtime dependency here and a
          # devDependency in tree-sitter-carve, and reading the wrong one yields
          # undefined, so the 40-hex check below would fail on the string
          # "undefined" rather than on anything real.
          spec_of() {
            node -p "const p=require('./package.json'); (p.dependencies||{})['$1'] ?? (p.devDependencies||{})['$1'] ?? ''"
          }

          check() {
            local pkg="$1" dir="$2" repo="$3"
            local spec rev behind
            spec="$(spec_of "${pkg}")"
            if [ -z "${spec}" ]; then
              echo "::error::${pkg} is not a dependency of this repo - this workflow is watching nothing"
              exit 1
            fi
            rev="${spec##*#}"
            if ! printf '%s' "${rev}" | grep -qE '^[0-9a-f]{40}$'; then
              echo "::error::${pkg} is \"${spec}\" - it must pin a 40-hex revision, or a fresh install takes whatever was on the default branch at the time"
              exit 1
            fi
            if ! git -C "${dir}" cat-file -e "${rev}^{commit}" 2>/dev/null; then
              echo "::error::${pkg} pins ${rev}, which is not a commit in markup-carve/${repo}"
              exit 1
            fi
            if ! git -C "${dir}" merge-base --is-ancestor "${rev}" origin/main; then
              echo "::error::${pkg} ${rev} is not on main, so the pin came from an unmerged or rewritten branch"
              exit 1
            fi
            behind="$(git -C "${dir}" rev-list --count "${rev}..origin/main")"
            echo "${pkg}: ${rev} ($(git -C "${dir}" log -1 --format=%s "${rev}"))"
            echo "  markup-carve/${repo} main is ${behind} commit(s) ahead"
            if [ "${behind}" -gt 0 ]; then
              echo "::warning::${pkg} is ${behind} commit(s) behind markup-carve/${repo} main"
            fi
          }

          check '@markup-carve/carve' carve-js carve-js

      - name: The released PHP engine is the tag it claims to be, and that tag is on main
        run: |
          set -euo pipefail

          pkg='markup-carve/carve-php'

          # A revision pin ties composer.json to composer.lock by comparing the
          # two hashes directly, and a version constraint cannot do that: the
          # constraint and the locked release are separately well-formed even
          # when the lockfile no longer answers the manifest. Composer's own
          # lock check is what closes that, and it reports the version that
          # fails to satisfy the constraint. `--no-check-all` keeps the
          # commit-ref warning on carve-grammars from turning into a failure.
          if ! composer validate --no-check-publish --no-check-all; then
            echo "::error::composer.json and composer.lock disagree - run composer update"
            exit 1
          fi

          constraint="$(php -r '$c=json_decode(file_get_contents("composer.json"), true); echo $c["require"][$argv[1]] ?? "";' "${pkg}")"
          if [ -z "${constraint}" ]; then
            echo "::error::${pkg} is not required by this repo - this check is watching nothing"
            exit 1
          fi
          if printf '%s' "${constraint}" | grep -qE '[0-9a-f]{40}'; then
            echo "::error::${pkg} is \"${constraint}\" - it pins a revision; it must require a published release"
            exit 1
          fi

          # `<rev> as <version>` makes a revision answer to a release number it
          # is not, and Composer records the lie in the lockfile's aliases.
          if php -r '$l=json_decode(file_get_contents("composer.lock"), true); foreach ($l["aliases"] ?? [] as $a) if (($a["package"] ?? "") === $argv[1]) exit(0); exit(1);' "${pkg}"; then
            echo "::error::composer.lock aliases ${pkg} to a version it is not"
            exit 1
          fi

          version="$(php -r '$l=json_decode(file_get_contents("composer.lock"), true); foreach ($l["packages"] as $p) if ($p["name"] === $argv[1]) { echo $p["version"] ?? ""; break; }' "${pkg}")"
          if ! printf '%s' "${version}" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::${pkg} resolves to \"${version}\" - a branch, not a published release"
            exit 1
          fi

          locked="$(php -r '$l=json_decode(file_get_contents("composer.lock"), true); foreach ($l["packages"] as $p) if ($p["name"] === $argv[1]) { echo $p["source"]["reference"] ?? ""; break; }' "${pkg}")"
          tag=""
          for candidate in "${version}" "v${version}" "${version#v}"; do
            if git -C carve-php rev-parse -q --verify "refs/tags/${candidate}^{commit}" >/dev/null 2>&1; then
              tag="${candidate}"
              break
            fi
          done
          if [ -z "${tag}" ]; then
            echo "::error::${pkg} resolves to ${version}, which is not a tag in markup-carve/carve-php"
            exit 1
          fi

          tagged="$(git -C carve-php rev-parse "refs/tags/${tag}^{commit}")"
          if [ "${locked}" != "${tagged}" ]; then
            echo "::error::composer.lock resolves ${pkg} ${version} to ${locked}, but tag ${tag} is ${tagged}"
            exit 1
          fi
          if ! git -C carve-php merge-base --is-ancestor "${tagged}" origin/main; then
            echo "::error::${pkg} ${version} is not on markup-carve/carve-php main"
            exit 1
          fi

          behind="$(git -C carve-php rev-list --count "${tagged}..origin/main")"
          echo "${pkg}: ${version} (${tagged}); markup-carve/carve-php main is ${behind} commit(s) ahead"
          if [ "${behind}" -gt 0 ]; then
            echo "::warning::${pkg} ${version} is ${behind} commit(s) behind markup-carve/carve-php main"
          fi

      - name: Every Composer development dependency pins a reachable main revision
        run: |
          set -euo pipefail

          check() {
            local pkg="$1" dir="$2" repo="$3"
            local constraint rev locked behind
            constraint="$(php -r '$c=json_decode(file_get_contents("composer.json"), true); echo $c["require"][$argv[1]] ?? "";' "${pkg}")"
            rev="$(printf '%s' "${constraint}" | grep -oE '[0-9a-f]{40}' || true)"
            if [ -z "${rev}" ]; then
              echo "::error::${pkg} is \"${constraint}\" - development dependencies must pin a 40-hex revision"
              exit 1
            fi
            locked="$(php -r '$l=json_decode(file_get_contents("composer.lock"), true); foreach ($l["packages"] as $p) if ($p["name"] === $argv[1]) { echo $p["source"]["reference"] ?? ""; break; }' "${pkg}")"
            if [ "${rev}" != "${locked}" ]; then
              echo "::error::composer.json pins ${pkg} at ${rev} but composer.lock resolves ${locked}"
              exit 1
            fi
            if ! git -C "${dir}" cat-file -e "${rev}^{commit}" 2>/dev/null; then
              echo "::error::${pkg} pins ${rev}, which is not a commit in markup-carve/${repo}"
              exit 1
            fi
            if ! git -C "${dir}" merge-base --is-ancestor "${rev}" origin/main; then
              echo "::error::${pkg} ${rev} is not on markup-carve/${repo} main"
              exit 1
            fi
            behind="$(git -C "${dir}" rev-list --count "${rev}..origin/main")"
            echo "${pkg}: ${rev}; markup-carve/${repo} main is ${behind} commit(s) ahead"
            if [ "${behind}" -gt 0 ]; then
              echo "::warning::${pkg} is ${behind} commit(s) behind markup-carve/${repo} main"
            fi
          }

          check 'markup-carve/carve-grammars' carve-grammars carve-grammars

      - name: The declared pins and the lockfile agree
        run: |
          set -euo pipefail

          # A lockfile records a git dependency TWICE: once as the installed
          # package's resolved URL under `node_modules/<pkg>`, and once as the
          # root package's declared range under `packages[""].dependencies`.
          # They are written at different times and can disagree - editing
          # package.json and refreshing only the install tree leaves the root
          # entry behind, and `npm ci` tolerates it. Two contradicting records
          # of one dependency is the state pinning exists to remove, so both are
          # compared against the manifest rather than only the resolved URL.
          agree() {
            local pkg="$1" declared locked root
            declared="$(node -p "const p=require('./package.json'); ((p.dependencies||{})['${pkg}'] ?? (p.devDependencies||{})['${pkg}'] ?? '').split('#').pop()")"
            locked="$(node -p "const l=require('./package-lock.json').packages['node_modules/${pkg}']; l ? String(l.resolved).split('#').pop() : ''")"
            if [ -z "${locked}" ]; then
              echo "::error::the lockfile has no entry for ${pkg}, so nothing here is reproducible"
              exit 1
            fi
            if [ "${declared}" != "${locked}" ]; then
              echo "::error::package.json pins ${pkg} at ${declared} but the lockfile resolves ${locked}"
              exit 1
            fi
            # Both root sections, for the same reason `declared` reads both:
            # npm mirrors package.json here, so a package declared under
            # devDependencies is recorded under the root's devDependencies and
            # reading only `dependencies` would report it as undeclared and fail
            # a repo that is perfectly consistent. The engine is a runtime
            # dependency here and a devDependency in tree-sitter-carve.
            root="$(node -p "const r=require('./package-lock.json').packages['']; ((r.dependencies||{})['${pkg}'] ?? (r.devDependencies||{})['${pkg}'] ?? '').split('#').pop()")"
            if [ -z "${root}" ]; then
              echo "::error::the lockfile's root entry does not declare ${pkg}, so the manifest and the lockfile disagree about what this repo depends on"
              exit 1
            fi
            if [ "${declared}" != "${root}" ]; then
              echo "::error::package.json pins ${pkg} at ${declared} but the lockfile's root dependency entry still declares ${root}"
              exit 1
            fi
            echo "package.json, the lockfile's root entry and its resolved URL all pin ${pkg} at ${declared}"
          }

          agree '@markup-carve/carve'

          pkg='@markup-carve/carve-grammars'
          declared="$(node -p "require('./package.json').dependencies['${pkg}'] || ''")"
          locked="$(node -p "require('./package-lock.json').packages['node_modules/${pkg}']?.version || ''")"
          root="$(node -p "require('./package-lock.json').packages[''].dependencies['${pkg}'] || ''")"
          if ! printf '%s' "${declared}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::${pkg} must be an exact released version, got ${declared}"
            exit 1
          fi
          if [ "${declared}" != "${locked}" ] || [ "${declared}" != "${root}" ]; then
            echo "::error::${pkg}: manifest=${declared}, installed=${locked}, lock root=${root}"
            exit 1
          fi
          echo "${pkg}: exact released version ${declared} agrees across manifest and lockfile"
